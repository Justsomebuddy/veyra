name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - run: python -m ruff check src tests scripts veyra_sage vam

  # Several interpreter versions run so the pinned handler digests stay
  # reproducible rather than binding one CPython build.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install make (windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: pytest
        run: make test PYTHON=python
      - name: hygiene
        run: make hygiene

  # `make cert` and `make verify` are deliberately absent above: the certificate
  # suite reaches the Lean bridges and fails closed without the pinned toolchain.
  # Run them from the `full` devshell after `elan toolchain install`.
  #
  # Reproducible shell for the proof and native gates. Linux only: the Lean
  # toolchain identity and the inotify runtime guard are Linux-native anyway.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: cache the nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - run: nix flake check --print-build-logs
