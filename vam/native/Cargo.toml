[package]
name = "vam-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Minimal honest Rust VAM0 native backend scaffold"
license = "MIT"
default-run = "vam0-inspect"

[dependencies]
# `spki` accepts newer base64ct releases whose edition/MSRV exceeds this
# crate's declared Rust 1.83 boundary. Keep the resolved closure reproducible.
base64ct = { version = "=1.7.3", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
# Keep the locked dependency closure inside this crate's declared Rust 1.83
# MSRV; zeroize 1.9 raises its own floor to Rust 1.85.
zeroize = { version = "=1.8.2", default-features = false }

[lib]
name = "vam_native"
path = "src/lib.rs"

[[bin]]
name = "vam0-inspect"
path = "src/main.rs"

[[bin]]
name = "vami-inspect"
path = "src/bin/vami-inspect.rs"

[[bin]]
name = "vam-observer-replay-v4"
path = "src/bin/vam-observer-replay-v4.rs"

[[bin]]
name = "vam-observer-discover-v5"
path = "src/bin/vam-observer-discover-v5.rs"

[[bin]]
name = "vam-observer-replay-v5"
path = "src/bin/vam-observer-replay-v5.rs"
